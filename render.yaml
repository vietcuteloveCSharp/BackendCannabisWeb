# =====================================================
# Render Infrastructure as Code Configuration
# Project: BackendCannabisWeb
# =====================================================

services:
  - type: web
    name: BackendCannabisWeb
    env: docker
    plan: free  # hoặc starter/pro nếu mày upgrade sau này
    branch: main
    region: singapore  # dùng "singapore" cho ping nhanh nhất ở VN
    dockerfilePath: ./Dockerfile
    autoDeploy: true  # Tự động deploy khi push code mới
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_RUNNING_IN_CONTAINER
        value: true
